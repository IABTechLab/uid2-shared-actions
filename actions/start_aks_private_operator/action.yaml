name: Start AKS Private Operator
description: Spins up an AKS private operator

inputs:
  template_file:
    description: The template file
    required: true
  azure_client_id:
    description: The Azure application client ID for OIDC login
    required: true
  azure_tenant_id:
    description: The Azure tenant ID for OIDC login
    required: true
  azure_subscription_id:
    description: The Azure subscription ID for OIDC login
    required: true
  run_id:
    description: Unique run identifier for resource naming
    required: true

outputs:
  uid2_pipeline_e2e_operator_url:
    description: The AKS operator URL
    value: ${{ steps.start_aks.outputs.uid2_pipeline_e2e_operator_url }}

runs:
  using: "composite"

  steps:
    - name: Log in to Azure with OIDC
      uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
      with:
        client-id: ${{ inputs.azure_client_id }}
        tenant-id: ${{ inputs.azure_tenant_id }}
        subscription-id: ${{ inputs.azure_subscription_id }}
        enable-AzPSSession: true

    - name: Start AKS private operator
      id: start_aks
      shell: bash
      env:
        TEMPLATE_FILE: ${{ inputs.template_file }}
        RUN_ID: ${{ inputs.run_id }}
      run: |
        bash uid2-shared-actions/scripts/aks/start_aks_enclave.sh
