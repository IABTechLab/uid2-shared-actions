name: Test pin_azure_cli (temporary)

# TEMPORARY — delete before merging UID2-7823.
# Calls the action by relative path so it exercises this branch's version;
# shared-run-e2e-tests.yaml cannot, because it references the action at @v3.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Show runner state before
        run: |
          echo "preinstalled azure-cli: $(dpkg-query -W -f='${Version}' azure-cli 2>/dev/null || echo none)"
          echo "--- apt sources mentioning microsoft ---"
          grep -rl microsoft /etc/apt/sources.list.d/ 2>/dev/null || echo "(none)"

      - name: Pin azure-cli
        uses: ./actions/pin_azure_cli
        with:
          azure_cli_version: '2.87.0'

      - name: Verify the pinned version installed
        run: |
          az --version
          pkg="$(dpkg-query -W -f='${Version}' azure-cli)"
          echo "installed azure-cli: ${pkg}"
          if [[ "${pkg}" != 2.87.0-1~* ]]; then
            echo "::error::expected 2.87.0, got ${pkg}"
            exit 1
          fi
